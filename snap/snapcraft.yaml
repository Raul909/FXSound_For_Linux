name: fxsound-linux
base: core22
version: '1.2.0'
summary: Audio enhancer with 10-band EQ and effects
description: |
  A free, open-source audio enhancer for Linux with a 10-band equalizer,
  effects, presets, and real-time audio visualization. Adds an "FXSound"
  output device and processes everything your system plays through it,
  via PulseAudio or PipeWire.
grade: stable
confinement: strict

architectures:
  - build-on: amd64

apps:
  fxsound-linux:
    command: bin/fxsound-linux
    # Menu entry and icon come from snap/gui/.
    extensions: [gnome]
    plugs:
      - audio-playback
      # Some audio servers (newer PipeWire builds, Ubuntu's PulseAudio) only
      # let snaps record with this connected; it is not connected
      # automatically: sudo snap connect fxsound-linux:audio-record
      - audio-record
      - pulseaudio
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl

parts:
  fxsound-linux:
    plugin: nil
    source: .
    build-packages:
      - curl
      - wget
      - pkg-config
      - libpulse-dev
      - libssl-dev
      - libwebkit2gtk-4.1-dev
      - libgtk-3-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
    # No stage-packages: the gnome extension's gnome-42-2204 platform snap
    # already provides WebKitGTK 4.1, GTK 3, libpulse and Mesa. Staging them
    # again pulled a second, older Mesa (23.2) into the snap alongside the
    # platform's (25.2), and mixing the two aborted every launch with
    # "libEGL fatal: did not find extension DRI_Mesa version 1".
    override-build: |
      # Install Rust
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
      export PATH="$HOME/.cargo/bin:$PATH"

      # Install Node.js 20
      curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      apt-get install -y nodejs

      # Build frontend + Tauri binary (the snap needs no .deb/.rpm/AppImage)
      npm ci
      npm run tauri -- build --no-bundle

      install -Dm755 src-tauri/target/release/fxsound-linux \
        "$SNAPCRAFT_PART_INSTALL/bin/fxsound-linux"
