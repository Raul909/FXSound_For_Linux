name: fxsound-linux
base: core22
version: '1.0.0'
summary: Audio enhancer with 10-band EQ and effects
description: |
  A free, open-source audio enhancer for Linux with a 10-band equalizer,
  effects, presets, and real-time audio visualization. Processes system
  audio in real time via PulseAudio/PipeWire.

grade: stable
confinement: strict

architectures:
  - build-on: amd64

apps:
  fxsound-linux:
    command: bin/fxsound-linux
    extensions: [gnome]
    plugs:
      - audio-playback
      - audio-record
      - pulseaudio
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl

parts:
  fxsound-linux:
    plugin: nil
    source: .
    build-packages:
      - curl
      - wget
      - pkg-config
      - libpulse-dev
      - libssl-dev
      - libwebkit2gtk-4.1-dev
      - libgtk-3-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
    stage-packages:
      - libpulse0
      - libwebkit2gtk-4.1-0
      - libgtk-3-0
      - libayatana-appindicator3-1
    override-build: |
      # Install Rust
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
      export PATH="$HOME/.cargo/bin:$PATH"

      # Install Node.js 20
      curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      apt-get install -y nodejs

      # Build frontend + Tauri
      npm ci
      npm run tauri:build

      install -Dm755 src-tauri/target/release/fxsound-linux \
        "$SNAPCRAFT_PART_INSTALL/bin/fxsound-linux"
